name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read
  pull-requests: read

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Misma versión LTS que en local; npm instala exactamente lo de package-lock.json
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          # Variable del repositorio (no secreta): Settings → Secrets and variables → Actions → Variables
          VITE_CLARITY_ID: ${{ vars.VITE_CLARITY_ID }}
        run: npm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          name: github-pages
          # Desde la v4 los archivos ocultos se excluyen por defecto; se mantienen
          # para publicar lo mismo que antes (.nojekyll, .vite/)
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages